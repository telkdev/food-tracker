# Morning wake-up for the Render free instance; server/plugins/keep-awake.ts keeps it awake 08:30–22:00 Warsaw.
# Several slots around 08:30 Warsaw in both CET (07:30 UTC) and CEST (06:30 UTC), because GitHub often delays
# or skips scheduled runs. Best effort only: if none fires, the first visit of the day wakes it (~1 min).
# GitHub disables schedules after 60 days without repo activity.
name: wake-up
on:
  schedule:
    - cron: '20,30,40 6,7 * * *' # UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://food-tracker-lt1f.onrender.com/api/ping
