# Render Blueprint. Region: Frankfurt (closest to Warsaw).
# Plan choices are deliberate, see docs/decisions.md "Hosting":
#  - web: free for now (steps 1-4). Free instances sleep after 15 min and take ~1 min to wake;
#    claude.ai gives OAuth discovery/token endpoints 10 s, so switch to `starter` before step 5 (MCP).
#    Free plan has no preDeployCommand, so migrations run at start (idempotent). On starter, move
#    `npm run db:migrate` back to preDeployCommand.
#  - database: not on Render free (deleted 30 days after creation). DATABASE_URL points at
#    Neon (free, no expiry) by default; to use Render Postgres instead, uncomment the
#    `databases` block and the fromDatabase line.
services:
  - type: web
    name: food-tracker
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && node .output/server/index.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # paste the Neon pooled connection string (…?sslmode=require)
      # - key: DATABASE_URL
      #   fromDatabase: { name: food-tracker-db, property: connectionString }
      - key: NUXT_APP_SECRET
        generateValue: true
      - key: NUXT_APP_PASSWORD
        sync: false # your login password, 12+ chars

